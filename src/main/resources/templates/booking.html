<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tour Package</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="booking-page">

<header>
    <h1>Book Tour Package</h1>
</header>

<div class="container">

    <label>Tourist ID</label>
    <input type="number" id="touristId" placeholder="Enter Tourist ID">

    <label>Package ID</label>
    <input type="number" id="packageId" placeholder="Enter Package ID">

    <label>Booking Date</label>
    <input type="date" id="bookingDate">

    <button onclick="bookPackage()">Book Now</button>

    <br><br>

    <a href="packages.html">
        <button type="button">Back to Packages</button>
    </a>

    <br><br>

    <a href="index.html">
        <button type="button">Home</button>
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
